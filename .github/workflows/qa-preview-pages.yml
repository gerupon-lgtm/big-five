name: Deploy QA preview to Pages

on:
  push:
    branches:
      - codex/big-five-q006
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all tests
        run: |
          set +e
          npm test 2>&1 | tee qa-test-output.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            node -e "const fs=require('node:fs'); const output=fs.readFileSync('qa-test-output.log','utf8').slice(-4000).replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'); console.log('::error title=Node test failure::'+output)"
          fi
          exit "$test_status"
      - name: Run static checks
        run: npm run check
      - name: Build QA preview artifact
        run: npm run qa:preview:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload QA preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/qa-preview

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy QA preview
        id: deployment
        uses: actions/deploy-pages@v4
